name: esp-idf examples
'on':
  push:
    paths:
    - examples/esp-idf/**/*.c
    - examples/esp-idf/**/*.cpp
    - examples/esp-idf/**/*.h
    - examples/esp-idf/**/*.hpp
    - examples/esp-idf/**/*.ino
    - examples/esp-idf/**/CMakeLists.txt
    - examples/esp-idf/**/Kconfig*
    - examples/esp-idf/**/sdkconfig.defaults
    - examples/esp-idf/**/*.yml
    - examples/esp-idf/**/*.yaml
    - examples/esp-idf/**/*.csv
    - firmware/12_factory_demo/CMakeLists.txt
    - firmware/12_factory_demo/sdkconfig.defaults
    - firmware/12_factory_demo/partitions.csv
    - libraries/RadioLib/src/**
    - libraries/RadioLib/CMakeLists.txt
    - libraries/RadioLib/idf_component.yml
    - config/frameworks.json
    - config/waveshare_boards.json
    - config/*.cmake
    - scripts/**
    - releases/*.py
    - .github/workflows/esp-idf.yml
    - firmware/12_factory_demo/**/*.c
    - firmware/12_factory_demo/**/*.cpp
    - firmware/12_factory_demo/**/*.h
    - firmware/12_factory_demo/**/*.hpp
    - firmware/12_factory_demo/**/CMakeLists.txt
    - firmware/12_factory_demo/**/Kconfig*
    - firmware/12_factory_demo/**/*.yml
    - firmware/12_factory_demo/**/*.yaml
  pull_request:
    paths:
    - examples/esp-idf/**/*.c
    - examples/esp-idf/**/*.cpp
    - examples/esp-idf/**/*.h
    - examples/esp-idf/**/*.hpp
    - examples/esp-idf/**/*.ino
    - examples/esp-idf/**/CMakeLists.txt
    - examples/esp-idf/**/Kconfig*
    - examples/esp-idf/**/sdkconfig.defaults
    - examples/esp-idf/**/*.yml
    - examples/esp-idf/**/*.yaml
    - examples/esp-idf/**/*.csv
    - firmware/12_factory_demo/CMakeLists.txt
    - firmware/12_factory_demo/sdkconfig.defaults
    - firmware/12_factory_demo/partitions.csv
    - libraries/RadioLib/src/**
    - libraries/RadioLib/CMakeLists.txt
    - libraries/RadioLib/idf_component.yml
    - config/frameworks.json
    - config/waveshare_boards.json
    - config/*.cmake
    - scripts/**
    - releases/*.py
    - .github/workflows/esp-idf.yml
    - firmware/12_factory_demo/**/*.c
    - firmware/12_factory_demo/**/*.cpp
    - firmware/12_factory_demo/**/*.h
    - firmware/12_factory_demo/**/*.hpp
    - firmware/12_factory_demo/**/CMakeLists.txt
    - firmware/12_factory_demo/**/Kconfig*
    - firmware/12_factory_demo/**/*.yml
    - firmware/12_factory_demo/**/*.yaml
  workflow_dispatch:
    inputs:
      example:
        description: all, example name, or repository-relative directory
        default: all
        required: true
        type: string
permissions:
  contents: read
jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      development_matrix: ${{ steps.matrix.outputs.development_matrix }}
    steps:
    - uses: actions/checkout@v4
    - id: matrix
      env:
        SELECTOR: ${{ inputs.example || 'all' }}
      run: |
        python3 scripts/discover_examples.py --framework esp-idf --selector "$SELECTOR" > matrix.json
        python3 scripts/discover_examples.py --framework esp-idf --channel development --selector "$SELECTOR" > development-matrix.json
        echo "matrix=$(cat matrix.json)" >> "$GITHUB_OUTPUT"
        echo "development_matrix=$(cat development-matrix.json)" >> "$GITHUB_OUTPUT"
  build:
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover.outputs.matrix) }}
    steps:
    - uses: actions/checkout@v4
    - name: Build selected ESP32-S3 project
      uses: espressif/esp-idf-ci-action@v1
      with:
        esp_idf_version: ${{ matrix.version }}
        target: ${{ matrix.target }}
        path: ${{ matrix.path }}
        command: |
          python -m pip install "idf-component-manager==${{ matrix.component_manager }}" "esp-bmgr-assist==${{ matrix.bmgr_assist }}"
          idf.py reconfigure
          idf.py bmgr -l
          idf.py bmgr -b "${{ matrix.board }}"
          idf.py build
    - name: Package source firmware
      env:
        EXAMPLE: ${{ matrix.name }}
        VERSION: ${{ matrix.version }}
      run: python3 releases/package_firmware.py --framework esp-idf --selector "$EXAMPLE" --version "$VERSION"
    - uses: actions/upload-artifact@v4
      with:
        name: esp-idf-${{ matrix.name }}-${{ matrix.version }}-${{ matrix.target }}
        path: releases/dist/*.zip
        if-no-files-found: error
  build-idf62:
    name: ESP-IDF 6.2 development / ${{ matrix.name }}
    needs: discover
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover.outputs.development_matrix) }}
    env:
      IDF_TOOLS_PATH: ${{ runner.temp }}/idf62-tools
    steps:
    - uses: actions/checkout@v4
    - name: Checkout pinned ESP-IDF 6.2 development source
      uses: actions/checkout@v4
      with:
        repository: espressif/esp-idf
        ref: ${{ matrix.ref }}
        path: .ci/esp-idf
        submodules: recursive
        persist-credentials: false
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install ESP-IDF host dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y flex bison gperf cmake ninja-build ccache libffi-dev libssl-dev dfu-util libusb-1.0-0
    - name: Install toolchain for the pinned framework
      working-directory: .ci/esp-idf
      run: ./install.sh esp32s3
    - name: Build selected ESP32-S3 project with ESP-IDF 6.2
      working-directory: ${{ matrix.path }}
      env:
        TARGET: ${{ matrix.target }}
      shell: bash
      run: |
        source "$GITHUB_WORKSPACE/.ci/esp-idf/export.sh"
        python -m pip install "idf-component-manager==${{ matrix.component_manager }}" "esp-bmgr-assist==${{ matrix.bmgr_assist }}"
        idf.py -D IDF_TARGET="$TARGET" reconfigure
        idf.py bmgr -l
        idf.py bmgr -b "${{ matrix.board }}"
        idf.py -D IDF_TARGET="$TARGET" build
    - name: Package development firmware with framework revision
      env:
        EXAMPLE: ${{ matrix.name }}
        VERSION: ${{ matrix.version }}
      run: python3 releases/package_firmware.py --framework esp-idf --selector "$EXAMPLE" --version "$VERSION"
    - uses: actions/upload-artifact@v4
      with:
        name: esp-idf-${{ matrix.name }}-${{ matrix.version }}-${{ matrix.target }}
        path: releases/dist/*.zip
        if-no-files-found: error
