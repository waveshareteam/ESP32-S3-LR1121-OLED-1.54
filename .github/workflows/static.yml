name: Repository static checks
on:
  push:
    branches: ['**']
    paths: ['examples/**', 'firmware/12_factory_demo/**', 'config/**', 'scripts/**', 'tests/**', 'releases/**', 'docs/**', '*.md', '.github/**']
  pull_request:
    paths: ['examples/**', 'firmware/12_factory_demo/**', 'config/**', 'scripts/**', 'tests/**', 'releases/**', 'docs/**', '*.md', '.github/**']
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  workflows:
    name: Validate GitHub Actions workflows
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check workflow syntax and expression contexts
        run: |
          mkdir -p "$RUNNER_TEMP/actionlint"
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/actionlint/tool.tar.gz" https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint/tool.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint/tool.tar.gz" -C "$RUNNER_TEMP/actionlint" actionlint
          "$RUNNER_TEMP/actionlint/actionlint" -color
  static:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML==6.0.2
      - run: python -m unittest discover -s tests -v
      - run: python scripts/validate_repo.py
      - run: python scripts/scan_public_content.py
      - run: python scripts/inventory_repo.py > inventory.json
      - run: git diff --check
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: source-inventory
          path: inventory.json
